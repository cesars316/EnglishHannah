name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Una sola ejecucion por rama: las ejecuciones antiguas se cancelan.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint, tipos, contenido, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar el contenido pedagogico
        run: npm run validate:content

      - name: Analisis estatico (ESLint)
        run: npm run lint

      - name: Comprobar tipos (TypeScript)
        run: npm run typecheck

      - name: Pruebas unitarias y de componentes
        run: npm run test

      - name: Compilar la aplicacion
        run: npm run build
        env:
          AUTH_SECRET: ci-test-secret-please-replace-in-production-min-48-bytes-long
          MONGODB_URI: mongodb://localhost:27017/english_quest_ci
          NODE_ENV: production

  integration:
    name: pruebas de integracion (MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality]

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MONGODB_URI: mongodb://localhost:27017/english_quest_test
      AUTH_SECRET: ci-integration-secret-min-48-bytes-long-for-testing
      NODE_ENV: test

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas de integracion
        run: npm run test:integration

  e2e:
    name: pruebas E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MONGODB_URI: mongodb://localhost:27017/english_quest_e2e
      AUTH_SECRET: ci-e2e-secret-min-48-bytes-long-for-testing-purposes-only
      NODE_ENV: development
      E2E_BASE_URL: http://localhost:3000

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        run: npx playwright test --project=desktop-chromium

      - name: Subir artefactos Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
