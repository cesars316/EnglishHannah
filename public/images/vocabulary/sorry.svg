<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Mano pidiendo perdon">
  <rect width="160" height="160" rx="32" fill="#eff8ff"/>
  <!-- Brazo -->
  <rect x="66" y="86" width="30" height="14" rx="7" fill="#f0b98c" transform="rotate(-10 66 86)"/>
  <!-- Manos juntas (gesto de disculpa) -->
  <ellipse cx="86" cy="74" rx="14" ry="16" fill="#f7c9a3" transform="rotate(-10 86 74)"/>
  <ellipse cx="74" cy="78" rx="14" ry="16" fill="#f0b98c" transform="rotate(20 74 78)"/>
  <!-- Dedos entrelazados -->
  <rect x="82" y="58" width="9" height="22" rx="4.5" fill="#f7c9a3" transform="rotate(-10 86.5 58)"/>
  <rect x="72" y="62" width="9" height="22" rx="4.5" fill="#f0b98c" transform="rotate(20 76.5 62)"/>
  <!-- Cabeza baja -->
  <ellipse cx="70" cy="104" rx="16" ry="18" fill="#f7c9a3"/>
  <ellipse cx="98" cy="108" rx="14" ry="16" fill="#f0b98c"/>
  <!-- Ojos tristes -->
  <circle cx="66" cy="104" r="4" fill="#2b2118"/>
  <circle cx="94" cy="108" r="4" fill="#2b2118"/>
  <!-- Boca triste -->
  <path d="M74 116q10 -6 18 0" stroke="#2b2118" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Lagrima -->
  <path d="M60 100q-2 8 2 12" stroke="#4ba9f2" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>