<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Alguien pide perdon inclinandose y juntando las manos">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f8ff"/>
      <stop offset="100%" stop-color="#e6f3ff"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#bg4)"/>
  <ellipse cx="100" cy="172" rx="78" ry="12" fill="#eaf6ff"/>
  <!-- Persona que escucha (derecha) -->
  <ellipse cx="138" cy="122" rx="18" ry="20" fill="#f0b98c"/>
  <circle cx="138" cy="96" r="20" fill="#f0b98c"/>
  <circle cx="132" cy="94" r="4" fill="#2b2118"/>
  <circle cx="144" cy="94" r="4" fill="#2b2118"/>
  <path d="M136 104 Q138 106 140 104" stroke="#2b2118" stroke-width="3" stroke-linecap="round" fill="none"/>
  <rect x="128" y="140" width="20" height="24" rx="10" fill="#2e9e6b"/>
  <!-- Persona que pide perdon (izquierda, muy inclinado) -->
  <ellipse cx="72" cy="138" rx="18" ry="20" fill="#f7c9a3" transform="rotate(-18 72 138)"/>
  <circle cx="62" cy="110" r="20" fill="#f7c9a3" transform="rotate(-18 62 110)"/>
  <circle cx="56" cy="108" r="4" fill="#2b2118"/>
  <circle cx="66" cy="106" r="4" fill="#2b2118"/>
  <!-- Boca triste -->
  <path d="M60 116 Q58 118 56 116" stroke="#2b2118" stroke-width="3" stroke-linecap="round" fill="none"/>
  <rect x="62" y="156" width="20" height="22" rx="10" fill="#4ba9f2" transform="rotate(-18 72 167)"/>
  <!-- Cabeza inclinada hacia abajo -->
  <circle cx="58" cy="108" r="18" fill="#f7c9a3" transform="rotate(-25 58 108)"/>
  <circle cx="54" cy="106" r="4" fill="#2b2118"/>
  <circle cx="64" cy="104" r="4" fill="#2b2118"/>
  <path d="M56 114 Q54 116 52 114" stroke="#2b2118" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Manos grandes juntas -->
  <path d="M78 126 Q90 134 102 126" stroke="#f7c9a3" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M82 122 Q92 128 98 122" stroke="#f7c9a3" stroke-width="14" stroke-linecap="round" fill="none"/>
</svg>