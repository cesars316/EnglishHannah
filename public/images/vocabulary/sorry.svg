<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Uno pide perdon al otro">
  <rect width="160" height="160" rx="32" fill="#eff8ff"/>
  <!-- Suelo -->
  <ellipse cx="80" cy="138" rx="62" ry="10" fill="#e7f6ff"/>
  <!-- Figura 1 (derecha, espera) -->
  <ellipse cx="112" cy="96" rx="14" ry="16" fill="#f0b98c"/>
  <circle cx="112" cy="76" r="16" fill="#f0b98c"/>
  <circle cx="107" cy="74" r="3" fill="#2b2118"/>
  <circle cx="117" cy="74" r="3" fill="#2b2118"/>
  <path d="M110 82q2 2 4 0" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Cuerpo figura 1 -->
  <rect x="104" y="110" width="16" height="18" rx="8" fill="#2e9e6b"/>
  <!-- Figura 2 (izquierda, pidiendo perdon) -->
  <ellipse cx="52" cy="100" rx="14" ry="16" fill="#f7c9a3"/>
  <circle cx="52" cy="80" r="16" fill="#f7c9a3"/>
  <circle cx="47" cy="78" r="3" fill="#2b2118"/>
  <circle cx="57" cy="78" r="3" fill="#2b2118"/>
  <!-- Ojos tristes -->
  <path d="M45 84q2 2 4 0" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M55 84q2 2 4 0" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Boca triste -->
  <path d="M50 90q2 -2 4 0" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Cuerpo figura 2 inclinado -->
  <rect x="44" y="114" width="16" height="18" rx="8" fill="#4ba9f2" transform="rotate(-8 52 123)"/>
  <!-- Manos juntas pidiendo perdon -->
  <path d="M60 108q6 4 12 0" stroke="#f7c9a3" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M62 106q4 2 8 0" stroke="#f7c9a3" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Cabeza inclinada -->
  <circle cx="52" cy="80" r="16" fill="none" transform="rotate(-12 52 80)"/>
  <circle cx="50" cy="78" r="16" fill="#f7c9a3" transform="rotate(-12 50 78)"/>
  <circle cx="46" cy="76" r="3" fill="#2b2118"/>
  <circle cx="56" cy="76" r="3" fill="#2b2118"/>
  <path d="M50 82q-2 2 -4 0" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>