<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Alguien pide por favor con las manos juntas e inclinado hacia delante">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6ec"/>
      <stop offset="100%" stop-color="#f7efe2"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#bg6)"/>
  <ellipse cx="100" cy="172" rx="78" ry="12" fill="#eaf6ff"/>
  <!-- Persona que escucha (derecha) -->
  <ellipse cx="138" cy="122" rx="18" ry="20" fill="#f0b98c"/>
  <circle cx="138" cy="96" r="20" fill="#f0b98c"/>
  <circle cx="132" cy="94" r="4" fill="#2b2118"/>
  <circle cx="144" cy="94" r="4" fill="#2b2118"/>
  <path d="M136 104 Q138 106 140 104" stroke="#2b2118" stroke-width="3" stroke-linecap="round" fill="none"/>
  <rect x="128" y="140" width="20" height="24" rx="10" fill="#2e9e6b"/>
  <!-- Persona que pide (izquierda, inclinado hacia delante) -->
  <ellipse cx="74" cy="128" rx="18" ry="20" fill="#f7c9a3" transform="rotate(-10 74 128)"/>
  <circle cx="68" cy="100" r="20" fill="#f7c9a3" transform="rotate(-10 68 100)"/>
  <circle cx="62" cy="98" r="4" fill="#2b2118"/>
  <circle cx="74" cy="96" r="4" fill="#2b2118"/>
  <path d="M66 108 Q68 110 70 108" stroke="#2b2118" stroke-width="3" stroke-linecap="round" fill="none"/>
  <rect x="66" y="146" width="20" height="24" rx="10" fill="#4ba9f2" transform="rotate(-10 76 158)"/>
  <!-- Manos juntas grandes delante -->
  <path d="M84 118 Q96 130 110 118" stroke="#f7c9a3" stroke-width="20" stroke-linecap="round" fill="none"/>
  <path d="M88 114 Q98 124 106 114" stroke="#f7c9a3" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- Ojos mirando hacia arriba/suplicando -->
