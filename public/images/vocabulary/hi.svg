<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Dos amigos saludandose de cerca">
  <rect width="160" height="160" rx="32" fill="#eff8ff"/>
  <!-- Suelo -->
  <ellipse cx="80" cy="138" rx="58" ry="10" fill="#e7f6ff"/>
  <!-- Figura 1 (izquierda, mas cerca) -->
  <ellipse cx="56" cy="96" rx="14" ry="16" fill="#f7c9a3"/>
  <circle cx="56" cy="76" r="16" fill="#f7c9a3"/>
  <circle cx="51" cy="74" r="3" fill="#2b2118"/>
  <circle cx="61" cy="74" r="3" fill="#2b2118"/>
  <path d="M54 82q2 2 4 0" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Cuerpo figura 1 -->
  <rect x="48" y="110" width="16" height="18" rx="8" fill="#f17fa6"/>
  <!-- Mano breve levantada -->
  <path d="M66 110q8 2 10 -6" stroke="#f7c9a3" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Figura 2 (derecha, mas cerca) -->
  <ellipse cx="104" cy="96" rx="14" ry="16" fill="#f0b98c"/>
  <circle cx="104" cy="76" r="16" fill="#f0b98c"/>
  <circle cx="99" cy="74" r="3" fill="#2b2118"/>
  <circle cx="109" cy="74" r="3" fill="#2b2118"/>
  <path d="M102 82q2 2 4 0" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Cuerpo figura 2 -->
  <rect x="96" y="110" width="16" height="18" rx="8" fill="#9b7ede"/>
  <!-- Mano breve levantada -->
  <path d="M94 110q-8 2 -10 -6" stroke="#f0b98c" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Sonrisa entre ellos -->
  <path d="M70 68q10 -4 20 0" stroke="#f5b32b" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>