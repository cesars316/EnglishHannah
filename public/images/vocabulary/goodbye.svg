<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Alguien se aleja y se despide con la mano">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6ec"/>
      <stop offset="100%" stop-color="#f7efe2"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#bg3)"/>
  <ellipse cx="100" cy="172" rx="78" ry="12" fill="#eaf6ff"/>
  <!-- Persona que se queda (izquierda) -->
  <ellipse cx="58" cy="120" rx="18" ry="20" fill="#f7c9a3"/>
  <circle cx="58" cy="94" r="20" fill="#f7c9a3"/>
  <circle cx="52" cy="92" r="4" fill="#2b2118"/>
  <circle cx="64" cy="92" r="4" fill="#2b2118"/>
  <path d="M56 102 Q58 104 60 102" stroke="#2b2118" stroke-width="3" stroke-linecap="round" fill="none"/>
  <rect x="48" y="138" width="20" height="26" rx="10" fill="#4ba9f2"/>
  <!-- Persona que se va (derecha, de espaldas y alejandose) -->
  <ellipse cx="142" cy="122" rx="18" ry="20" fill="#f0b98c"/>
  <circle cx="142" cy="96" r="20" fill="#f0b98c"/>
  <circle cx="148" cy="94" r="4" fill="#2b2118"/>
  <!-- Espalda visible, sin cara frontal -->
  <ellipse cx="142" cy="96" rx="18" ry="18" fill="#f0b98c"/>
  <path d="M128 94 Q134 88 142 88 Q150 88 156 94" fill="#b98a56" opacity="0.6"/>
  <rect x="132" y="140" width="20" height="26" rx="10" fill="#ffb347"/>
  <!-- Mano levantada por encima del hombro despidiendose -->
  <path d="M126 142 Q98 112 112 78" stroke="#f0b98c" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M128 138 Q106 114 118 86" stroke="#f0b98c" stroke-width="12" stroke-linecap="round" fill="none"/>
  <ellipse cx="120" cy="82" rx="12" ry="14" fill="#f0b98c" transform="rotate(-40 120 82)"/>
  <!-- Huellas alejandose -->
  <ellipse cx="158" cy="158" rx="5" ry="2.5" fill="#b9d9f3" transform="rotate(-15 158 158)"/>
  <ellipse cx="170" cy="150" rx="5" ry="2.5" fill="#b9d9f3" transform="rotate(-20 170 150)"/>
  <ellipse cx="182" cy="140" rx="5" ry="2.5" fill="#b9d9f3" transform="rotate(-25 182 140)"/>
</svg>