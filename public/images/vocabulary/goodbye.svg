<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Uno se aleja y se despide con la mano">
  <rect width="160" height="160" rx="32" fill="#fdf4e7"/>
  <!-- Suelo -->
  <ellipse cx="80" cy="138" rx="62" ry="10" fill="#e7f6ff"/>
  <!-- Figura que se queda (izquierda) -->
  <ellipse cx="44" cy="94" rx="14" ry="16" fill="#f7c9a3"/>
  <circle cx="44" cy="74" r="16" fill="#f7c9a3"/>
  <circle cx="39" cy="72" r="3" fill="#2b2118"/>
  <circle cx="49" cy="72" r="3" fill="#2b2118"/>
  <path d="M42 80q2 2 4 0" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Cuerpo figura que se queda -->
  <rect x="36" y="108" width="16" height="20" rx="8" fill="#4ba9f2"/>
  <!-- Figura que se va (derecha, girada hacia atras) -->
  <ellipse cx="108" cy="94" rx="14" ry="16" fill="#f0b98c"/>
  <circle cx="108" cy="74" r="16" fill="#f0b98c"/>
  <circle cx="113" cy="72" r="3" fill="#2b2118"/>
  <circle cx="103" cy="72" r="3" fill="#2b2118"/>
  <path d="M106 80q2 2 4 0" stroke="#2b2118" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Cuerpo figura que se va -->
  <rect x="100" y="108" width="16" height="20" rx="8" fill="#ffb347"/>
  <!-- Mano despidiendose detras/girando -->
  <path d="M98 104q-12 2 -18 -8" stroke="#f0b98c" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M96 100q-12 0 -16 -10" stroke="#f0b98c" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Huellas alejandose -->
  <ellipse cx="122" cy="126" rx="4" ry="2" fill="#b9d9f3"/>
  <ellipse cx="132" cy="122" rx="4" ry="2" fill="#b9d9f3"/>
  <ellipse cx="142" cy="118" rx="4" ry="2" fill="#b9d9f3"/>
</svg>