<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Dos personas se saludan levantando la mano">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6ec"/>
      <stop offset="100%" stop-color="#f7efe2"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <ellipse cx="100" cy="172" rx="78" ry="12" fill="#eaf6ff"/>
  <!-- Persona A (izquierda) -->
  <ellipse cx="62" cy="118" rx="18" ry="20" fill="#f7c9a3"/>
  <circle cx="62" cy="92" r="20" fill="#f7c9a3"/>
  <circle cx="56" cy="90" r="4" fill="#2b2118"/>
  <circle cx="68" cy="90" r="4" fill="#2b2118"/>
  <path d="M60 100 Q62 102 64 100" stroke="#2b2118" stroke-width="3" stroke-linecap="round" fill="none"/>
  <rect x="52" y="136" width="20" height="26" rx="10" fill="#4ba9f2"/>
  <!-- Brazo levantado en alto saludando -->
  <path d="M46 140 Q28 108 46 78" stroke="#f7c9a3" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M48 136 Q34 112 50 86" stroke="#f7c9a3" stroke-width="12" stroke-linecap="round" fill="none"/>
  <ellipse cx="52" cy="82" rx="12" ry="14" fill="#f7c9a3" transform="rotate(-20 52 82)"/>
  <!-- Persona B (derecha) -->
  <ellipse cx="138" cy="118" rx="18" ry="20" fill="#f0b98c"/>
  <circle cx="138" cy="92" r="20" fill="#f0b98c"/>
  <circle cx="132" cy="90" r="4" fill="#2b2118"/>
  <circle cx="144" cy="90" r="4" fill="#2b2118"/>
  <path d="M136 100 Q138 102 140 100" stroke="#2b2118" stroke-width="3" stroke-linecap="round" fill="none"/>
  <rect x="128" y="136" width="20" height="26" rx="10" fill="#2e9e6b"/>
  <!-- Brazo levantado saludando -->
  <path d="M154 140 Q172 110 154 84" stroke="#f0b98c" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M152 136 Q166 114 150 90" stroke="#f0b98c" stroke-width="12" stroke-linecap="round" fill="none"/>
  <ellipse cx="148" cy="86" rx="12" ry="14" fill="#f0b98c" transform="rotate(20 148 86)"/>
  <!-- Linea de saludo -->
  <path d="M84 82 Q100 70 116 82" stroke="#f5b32b" stroke-width="5" stroke-linecap="round" fill="none"/>
